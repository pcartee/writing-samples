name: Automated Doc Review
on:
  pull_request:
    paths:
      - '**.md'
      - '**.mdx'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vale Linter (Microsoft Style)
        uses: vale-cli/vale-action@v3
        with:
          files: all
          fail_on_error: true
          reporter: github-pr-check
